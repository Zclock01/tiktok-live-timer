<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overlay</title>
<style>html,body{margin:0;background:transparent;overflow:hidden;font-family:Arial,sans-serif}.box{display:inline-block;background:rgba(0,0,0,.72);color:#fff;border-radius:16px;padding:10px 18px;font-size:46px;font-weight:900;text-shadow:0 2px 5px #000}.small{font-size:18px;margin-top:5px}</style></head><body>
<div class=box><span id=t>30:00</span><div class=small id=s>กำลังเชื่อมต่อ…</div></div>
<script>
let ws, reconnect=1000, sec=1800, running=true, receivedAt=Date.now(), base=1800;
function connect(){ws=new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+location.host+"/ws");
ws.onopen=()=>{reconnect=1000; s.textContent="● LIVE TIMER"};
ws.onclose=()=>{s.textContent="กำลังเชื่อมต่อ…";setTimeout(connect,reconnect);reconnect=Math.min(reconnect*2,10000)};
ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==="state"){sec=m.seconds;running=m.running;receivedAt=Date.now();}};
} connect();
function draw(){let x=sec-(running?Math.floor((Date.now()-receivedAt)/1000):0);x=Math.max(0,x);let m=Math.floor(x/60),q=x%60;t.textContent=String(m).padStart(2,"0")+":"+String(q).padStart(2,"0");requestAnimationFrame(draw)} draw();

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Remote Timer</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{
  margin-top:10px;
}

#timer{
  font-size:64px;
  font-weight:900;
  margin:25px 0;
}

button{
  width:90%;
  max-width:400px;
  padding:18px;
  margin:8px;
  border:0;
  border-radius:14px;
  font-size:24px;
  font-weight:900;
}

.add{
  background:#22c55e;
  color:#fff;
}

.minus{
  background:#ef4444;
  color:#fff;
}

.reset{
  background:#555;
  color:#fff;
}

.toggle{
  background:#2563eb;
  color:#fff;
}

#status{
  margin-top:15px;
  color:#aaa;
}
</style>
</head>

<body>

<h1>🎮 LIVE TIMER</h1>

<div id="timer">30:00</div>

<button class="add" onclick="addTime(60)">
+ 1 นาที
</button>

<button class="add" onclick="addTime(300)">
+ 5 นาที
</button>

<button class="add" onclick="addTime(600)">
+ 10 นาที
</button>

<button class="minus" onclick="addTime(-60)">
- 1 นาที
</button>

<button class="minus" onclick="addTime(-300)">
- 5 นาที
</button>

<button class="toggle" onclick="toggleTimer()">
หยุด / เล่น
</button>

<button class="reset" onclick="resetTimer()">
รีเซ็ต 30 นาที
</button>

<div id="status">
กำลังเชื่อมต่อ…
</div>

<script>

let ws;

let sec=1800;

let running=true;

let receivedAt=Date.now();

function connect(){

  ws=new WebSocket(
    (location.protocol==="https:"?"wss":"ws")
    +"://"+location.host+"/ws"
  );

  ws.onopen=()=>{

    status.textContent="● เชื่อมต่อแล้ว";

  };

  ws.onclose=()=>{

    status.textContent="กำลังเชื่อมต่อใหม่…";

    setTimeout(connect,1000);

  };

  ws.onmessage=e=>{

    let m=JSON.parse(e.data);

    if(m.type==="state"){

      sec=m.seconds;

      running=m.running;

      receivedAt=Date.now();

    }

  };

}

connect();

function addTime(seconds){

  if(ws && ws.readyState===WebSocket.OPEN){

    ws.send(JSON.stringify({

      type:"add",

      seconds:seconds

    }));

  }

}

function toggleTimer(){

  if(ws && ws.readyState===WebSocket.OPEN){

    ws.send(JSON.stringify({

      type:"toggle"

    }));

  }

}

function resetTimer(){

  if(ws && ws.readyState===WebSocket.OPEN){

    ws.send(JSON.stringify({

      type:"reset",

      seconds:1800

    }));

  }

}

function draw(){

  let x=sec-(running
    ?Math.floor((Date.now()-receivedAt)/1000)
    :0);

  x=Math.max(0,x);

  let m=Math.floor(x/60);

  let s=x%60;

  timer.textContent=
    String(m).padStart(2,"0")
    +":"
    +String(s).padStart(2,"0");

  requestAnimationFrame(draw);

}

draw();

</script>

</body>
</html>

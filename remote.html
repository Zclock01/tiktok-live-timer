<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Remote</title>
<style>body{margin:0;background:#111;color:#fff;font-family:Arial;padding:18px}.wrap{max-width:520px;margin:auto}.time{text-align:center;font-size:58px;font-weight:900;margin:10px}.status{text-align:center;color:#aaa;margin-bottom:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{min-height:62px;border:0;border-radius:15px;background:#292929;color:#fff;font-size:21px;font-weight:800}button:active{transform:scale(.98)}.main{grid-column:1/-1;background:#444}input{box-sizing:border-box;width:100%;padding:15px;border-radius:12px;background:#222;color:#fff;border:1px solid #555;font-size:18px;margin-bottom:10px}</style></head><body><div class=wrap>
<div class=time id=t>30:00</div><div class=status id=s>กำลังเชื่อมต่อ…</div>
<input id=start type=number min=0 value=30><div class=grid>
<button class=main id=reset>🔄 เริ่มใหม่ตามนาทีด้านบน</button>
<button data-n=-60>− 1 นาที</button><button data-n=60>+ 1 นาที</button>
<button data-n=-300>− 5 นาที</button><button data-n=300>+ 5 นาที</button>
<button data-n=-10>− 10 วินาที</button><button data-n=10>+ 10 วินาที</button>
<button class=main id=toggle>⏸ หยุดเวลา</button>
</div></div>
<script>
let ws,sec=1800,running=true,receivedAt=Date.now(),retry=1000;
function connect(){ws=new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+location.host+"/ws");ws.onopen=()=>{retry=1000;s.textContent="● เชื่อมต่อแล้ว"};ws.onclose=()=>{s.textContent="กำลังเชื่อมต่อ…";setTimeout(connect,retry);retry=Math.min(retry*2,10000)};ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==="state"){sec=m.seconds;running=m.running;receivedAt=Date.now();}}}connect();
function send(x){if(ws&&ws.readyState===1)ws.send(JSON.stringify(x))}
document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>send({type:"add",seconds:Number(b.dataset.n)}));
reset.onclick=()=>send({type:"reset",seconds:Math.max(0,Number(start.value)||0)*60});
toggle.onclick=()=>send({type:"toggle"});
function draw(){let x=sec+(running?Math.floor((Date.now()-receivedAt)/1000):0);x=Math.max(0,x);let m=Math.floor(x/60),q=x%60;t.textContent=String(m).padStart(2,"0")+":"+String(q).padStart(2,"0");toggle.textContent=running?"⏸ หยุดเวลา":"▶ เริ่มเวลา";requestAnimationFrame(draw)}draw();
</script></body></html>
